name: CI

on:
  pull_request:
  push:
    branches: [main, master, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://flowmind:ci-only-password@127.0.0.1:5432/flowmind_ci
      TEST_POSTGRES_DATABASE_URL: postgresql+psycopg://flowmind:ci-only-password@127.0.0.1:5432/flowmind_ci
      JWT_SECRET: ci-only-not-a-production-secret-at-least-32-characters
      DASHSCOPE_API_KEY: ""
      DASHSCOPE_BASE_URL: ""
      QWEN_MODEL: ""
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: flowmind_ci
          POSTGRES_USER: flowmind
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flowmind -d flowmind_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: alembic upgrade head
      - run: alembic current
      - run: alembic check
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: docker build -t flowmind-backend:ci ./backend
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=/api/v1 -t flowmind-frontend:ci ./frontend
