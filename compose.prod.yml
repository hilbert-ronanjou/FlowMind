name: flowmind-prod

x-backend-image: &backend-image
  image: flowmind-backend:${FLOWMIND_IMAGE_TAG:-m1-b}
  build:
    context: ./backend

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowmind}
      POSTGRES_USER: ${POSTGRES_USER:-flowmind}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    <<: *backend-image
    command: [alembic, upgrade, head]
    restart: "no"
    secrets:
      - source: backend_env
        target: /app/.env
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend-image
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      DOCUMENT_STORAGE_ROOT: /var/lib/flowmind/documents
    secrets:
      - source: backend_env
        target: /app/.env
    volumes:
      - documents:/var/lib/flowmind/documents
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: flowmind-frontend:${FLOWMIND_IMAGE_TAG:-m1-b}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    networks: [app]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.28.2-alpine@sha256:5b4900b042ccfa8b0a73df622c3a60f2322faeb2be800cbee5aa7b44d241649e
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [app]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # A single private bridge; not internal:true because Model Studio needs egress.
  app:
    driver: bridge

volumes:
  postgres_data:
  documents:

secrets:
  backend_env:
    file: ${BACKEND_ENV_FILE:-./.env.production}
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE to a protected password file}
