# Do not log Authorization, request bodies, or query strings.
log_format flowmind '$remote_addr $request_method $uri $status $body_bytes_sent';

server {
    listen 80;
    server_name flowmind.hilbertspace.cloud;
    server_tokens off;
    access_log /var/log/nginx/access.log flowmind;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://flowmind.hilbertspace.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name flowmind.hilbertspace.cloud;
    server_tokens off;
    access_log /var/log/nginx/access.log flowmind;

    ssl_certificate /etc/letsencrypt/live/flowmind.hilbertspace.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowmind.hilbertspace.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 20 MiB PDF + multipart envelope. FastAPI retains its 20 MiB file limit.
    client_max_body_size 21m;
    client_body_timeout 60s;

    # Re-resolve service addresses after application containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $frontend http://frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 180s;
    proxy_redirect off;

    location = /api/v1 {
        proxy_pass $backend$request_uri;
    }
    location ^~ /api/v1/ {
        proxy_pass $backend$request_uri;
    }
    location / {
        proxy_pass $frontend$request_uri;
    }
}
