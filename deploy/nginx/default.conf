# Do not log Authorization, request bodies, or query strings.
log_format flowmind '$remote_addr $request_method $uri $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log flowmind;

    # 20 MiB PDF + multipart envelope. FastAPI retains its 20 MiB file limit.
    client_max_body_size 21m;
    client_body_timeout 60s;

    # Re-resolve service addresses after application containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $frontend http://frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 180s;
    proxy_redirect off;

    location = /api/v1 {
        proxy_pass $backend$request_uri;
    }
    location ^~ /api/v1/ {
        proxy_pass $backend$request_uri;
    }
    location / {
        proxy_pass $frontend$request_uri;
    }
}
