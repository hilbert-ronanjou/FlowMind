# Bounded path categories keep user-entered URLs and query strings out of logs.
map $uri $log_path {
    default "other";
    =/ "home";
    ~^/api/v1(?:/|$) "api_v1";
    ~^/\.well-known/acme-challenge/ "acme_challenge";
}
log_format flowmind escape=json '{"timestamp":"$time_iso8601","request_id":"$request_id","method":"$request_method","path":"$log_path","status":$status,"request_time":$request_time,"upstream_response_time":"$upstream_response_time","upstream_addr":"$upstream_addr"}';

server {
    listen 80;
    server_name flowmind.hilbertspace.cloud;
    server_tokens off;
    access_log /var/log/nginx/access.log flowmind;
    add_header X-Request-ID $request_id always;
    proxy_hide_header X-Request-ID;

    # 20 MiB PDF + multipart envelope. FastAPI retains its 20 MiB file limit.
    client_max_body_size 21m;
    client_body_timeout 60s;

    # Re-resolve service addresses after application containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $frontend http://frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 180s;
    proxy_redirect off;

    location = /metrics {
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /api/v1 {
        proxy_pass $backend$request_uri;
    }
    location ^~ /api/v1/ {
        proxy_pass $backend$request_uri;
    }
    location / {
        proxy_pass $frontend$request_uri;
    }
}
